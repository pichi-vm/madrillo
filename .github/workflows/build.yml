name: Build and qualification (not full conformance)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo fmt --check
      - name: Conformance gate negative tests (not conformance evidence)
        run: python3 -m unittest tools/test_conformance.py
      - name: Bare library
        run: |
          cargo check --locked --no-default-features --lib
          python3 tools/check_library.py
      - name: All owned targets
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Current tests (coverage remains pending)
        run: cargo test --locked --all-features
      - name: Observe console loss with unread input
        run: cargo run --locked --features qualification --example pipe_liveness
      - name: Unix inherited pipe qualification
        if: runner.os != 'Windows'
        run: cargo run --locked --features qualification --example inherited_pipe
      - name: Unix terminal and inheritance composition
        if: runner.os != 'Windows'
        run: cargo run --locked --features qualification --example terminal_exec
      - name: Unix control rejects another account through a public socket
        if: runner.os != 'Windows'
        run: python3 tools/check_peer.py target/debug/madrillo target/debug/madrillo-fixture
      - name: Linux cgroup placement, descendants and isolated OOM
        if: runner.os == 'Linux'
        run: sudo python3 tools/check_cgroup.py target/debug/madrillo target/debug/madrillo-fixture /sys/fs/cgroup
      - name: Linux cgroup v1 in a disposable VM
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 cpio
          sudo python3 tools/check_cgroup_v1.py target/debug/madrillo target/debug/madrillo-fixture
      - name: Native systemd notification relay and attribution
        if: runner.os == 'Linux'
        run: sudo python3 tools/check_notify.py target/debug/madrillo target/debug/madrillo-fixture
      - name: Native syslog diagnostics and workload separation
        if: runner.os == 'Linux'
        run: sudo python3 tools/check_diagnostics.py target/debug/madrillo target/debug/madrillo-fixture
      - name: Native macOS diagnostic delivery and workload separation
        if: runner.os == 'macOS'
        run: python3 tools/check_syslog_macos.py target/debug/madrillo target/debug/madrillo-fixture
      - name: Monitor OOM protection and workload restoration
        if: runner.os == 'Linux'
        run: |
          python3 tools/check_oom_adjust.py target/debug/madrillo target/debug/madrillo-fixture
          sudo python3 tools/check_oom_adjust.py target/debug/madrillo target/debug/madrillo-fixture --require-protected
      - name: Named socket activation with actual child PID
        if: runner.os == 'Linux'
        run: python3 tools/check_activation.py target/debug/madrillo target/debug/madrillo-fixture
      - name: Build pinned conmon reference (test oracle only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libglib2.0-dev libsystemd-dev strace
          python3 tools/build_conmon.py .qualification/reference
      - name: Differential conmon log and exit fixtures
        if: runner.os == 'Linux'
        run: python3 tools/compare_conmon.py .qualification/reference/oracle.json target/debug/madrillo target/debug/madrillo-fixture
      - name: Differential native journal and combined file fixtures
        if: runner.os == 'Linux'
        run: sudo python3 tools/check_journal.py .qualification/reference/oracle.json target/debug/madrillo target/debug/madrillo-fixture
      - name: Native oversized journal datagram and sealed memfd fallback
        if: runner.os == 'Linux'
        run: cargo test --locked --features cli --bin madrillo oversized_datagram_uses_memfd_and_preserves_binary_message -- --ignored --nocapture
      - name: Isolated full disk and synchronization/publication faults
        if: runner.os == 'Linux'
        run: sudo unshare --mount --propagation private python3 tools/check_storage.py target/debug/madrillo target/debug/madrillo-fixture
      - name: State completion status
        shell: bash
        run: echo 'These checks do not constitute a full C01-C30 conformance pass.'
      - name: Package native executable, bare library and dependency licenses
        run: python3 tools/package.py .qualification/distribution
      - name: Retain native distribution for review
        uses: actions/upload-artifact@v4
        with:
          name: madrillo-${{ matrix.os }}
          path: .qualification/distribution/*
          if-no-files-found: error
