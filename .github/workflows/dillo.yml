name: Native Dillo VM qualification (not full conformance)

on:
  workflow_dispatch:
    inputs:
      dillo_revision:
        description: Exact Dillo commit to qualify
        required: true
        type: string

permissions:
  contents: read

jobs:
  vm:
    name: Dillo ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runners: '["ubuntu-24.04"]'
            guest: x86_64-unknown-linux-musl
          - name: linux-arm64
            runners: '["self-hosted","Linux","ARM64","bare-metal","aarch64","kvm"]'
            guest: aarch64-unknown-linux-musl
          - name: macos-arm64
            runners: '["self-hosted","macOS","ARM64","bare-metal","m1"]'
            guest: aarch64-unknown-linux-musl
          - name: windows-amd64
            runners: '["windows-2025"]'
            guest: x86_64-unknown-linux-musl
    runs-on: ${{ fromJSON(matrix.runners) }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Provide Python on minimal NixOS runners
        run: |
          if ! command -v python3 >/dev/null; then
            python=$(nix --extra-experimental-features 'nix-command flakes' build \
              --out-link "$RUNNER_TEMP/madrillo-ci-python" --print-out-paths \
              github:NixOS/nixpkgs/7dcdd87373d72e7a2173e4db02e20d3d7f495cfd#python313)
            echo "$python/bin" >> "$GITHUB_PATH"
          fi
      - name: Require an immutable Dillo revision
        env:
          DILLO_REVISION: ${{ inputs.dillo_revision }}
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r"[0-9a-f]{40}", os.environ["DILLO_REVISION"])
          PY
      - uses: actions/checkout@v4
        with:
          path: monitor
      - uses: actions/checkout@v4
        with:
          repository: pichi-vm/dillo
          ref: ${{ inputs.dillo_revision }}
          path: dillo
      - name: Install pinned toolchains and guest targets
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup toolchain install nightly-2026-07-06 --profile minimal --component rust-src
          rustup target add --toolchain nightly-2026-07-06 x86_64-unknown-none aarch64-unknown-none "${{ matrix.guest }}"
          mkdir -p dillo/.cargo
          cp dillo/packaging/cargo-config.toml dillo/.cargo/config.toml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            monitor -> target
            dillo -> target
      - name: Prepare KVM and 256 MiB guest memory
        if: runner.os == 'Linux'
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          original=$(sysctl -n vm.nr_hugepages)
          if [ "$original" -lt 128 ]; then
            echo "MADRILLO_ORIGINAL_HUGEPAGES=$original" >> "$GITHUB_ENV"
            sudo sysctl -w vm.nr_hugepages=128
          fi
          awk '/HugePages_Free:/ {exit ($2 < 128)}' /proc/meminfo
      - name: Build native monitor
        working-directory: monitor
        run: cargo +1.94.0 build --locked --features cli --bin madrillo
      - name: Real VM console input, EOF and monitor crash
        env:
          CARGO_BUILD_RUSTFLAGS: '-D warnings'
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess
          monitor = pathlib.Path('monitor').resolve()
          binary = monitor / 'target/debug' / ('madrillo.exe' if os.name == 'nt' else 'madrillo')
          subprocess.run(['git', '-C', str(monitor), 'rev-parse', 'HEAD'], check=True)
          subprocess.run(['python3', '-B', str(monitor / 'tools/check_dillo.py'), str(binary), 'dillo'], check=True)
          PY
      - name: Scope of evidence
        run: echo 'Real VM lifetime qualification only. Full C01-C30 conformance remains pending.'
      - name: Restore test-owned hugepage reservation
        if: always() && runner.os == 'Linux' && env.MADRILLO_ORIGINAL_HUGEPAGES != ''
        run: |
          # Do not replace a subsequent reservation made by another job.
          if [ "$(sysctl -n vm.nr_hugepages)" -eq 128 ]; then
            sudo sysctl -w "vm.nr_hugepages=$MADRILLO_ORIGINAL_HUGEPAGES"
          fi
      - name: Release the CI Python store reference
        if: always()
        run: rm -f "$RUNNER_TEMP/madrillo-ci-python"
