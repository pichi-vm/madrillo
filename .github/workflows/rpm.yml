name: Native RPM qualification (not full conformance)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rpm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and execute the standalone monitor package
        run: python3 -B tools/check_rpm.py --container
