[package]
name = "madrillo"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
publish = false
description = "A native process monitor inspired by conmon"

[features]
default = []
cli = ["dep:clap", "dep:serde_json", "dep:thiserror"]
qualification = ["cli", "dep:filedescriptor", "dep:portable-pty", "dep:process-wrap", "dep:command-fds", "dep:nix", "dep:rustix"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "madrillo"
path = "src/main.rs"
required-features = ["cli"]

[[example]]
name = "inherited_pipe"
path = "examples/inherited_pipe.rs"
required-features = ["qualification"]

[[example]]
name = "terminal_exec"
path = "examples/terminal_exec.rs"
required-features = ["qualification"]

[dependencies]
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
thiserror = { version = "2", optional = true }
filedescriptor = { version = "=0.8.3", optional = true }
portable-pty = { version = "=0.9.0", optional = true }
process-wrap = { version = "=10.0.1", features = ["std"], optional = true }

[target.'cfg(unix)'.dependencies]
command-fds = { version = "=0.3.3", optional = true }
nix = { version = "0.31", features = ["fs", "process", "signal", "poll", "term"], optional = true }
rustix = { version = "=1.1.6", features = ["process", "termios"], optional = true }

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "thin"
