[package]
name = "madrillo"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
publish = false
description = "A native process monitor inspired by conmon"

[features]
default = []
cli = ["dep:clap", "dep:serde_json", "dep:thiserror", "dep:chrono", "dep:tempfile", "dep:cap-std", "dep:cap-fs-ext", "dep:process-wrap", "dep:nix", "dep:rustix", "dep:interprocess", "dep:filedescriptor", "dep:widestring", "dep:signal-hook", "dep:command-fds", "dep:system-interface", "dep:conpty-oxide", "dep:win-custody", "dep:winx", "dep:syslog"]
qualification = ["cli", "dep:filedescriptor", "dep:portable-pty", "dep:process-wrap", "dep:command-fds", "dep:nix", "dep:rustix", "dep:terminal_size", "dep:windows-spawn"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "madrillo"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "madrillo-fixture"
path = "tests/support/workload.rs"
required-features = ["qualification"]

[[test]]
name = "core"
required-features = ["qualification"]

[[test]]
name = "control"
required-features = ["qualification"]

[[example]]
name = "inherited_pipe"
path = "examples/inherited_pipe.rs"
required-features = ["qualification"]

[[example]]
name = "terminal_exec"
path = "examples/terminal_exec.rs"
required-features = ["qualification"]

[[example]]
name = "pipe_liveness"
path = "examples/pipe_liveness.rs"
required-features = ["qualification"]

[dependencies]
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
thiserror = { version = "2", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"], optional = true }
tempfile = { version = "3", optional = true }
cap-std = { version = "=4.0.3", optional = true }
cap-fs-ext = { version = "=4.0.3", optional = true }
interprocess = { version = "=2.4.7", optional = true }
filedescriptor = { version = "=0.8.3", optional = true }
portable-pty = { version = "=0.9.0", optional = true }
terminal_size = { version = "=0.4.3", optional = true }
process-wrap = { version = "=10.0.1", features = ["std"], optional = true }

[target.'cfg(unix)'.dependencies]
command-fds = { version = "=0.3.3", optional = true }
nix = { version = "0.31", features = ["fs", "process", "signal", "poll", "term", "socket", "uio"], optional = true }
rustix = { version = "=1.1.6", features = ["process", "termios"], optional = true }
signal-hook = { version = "0.3", optional = true }
syslog = { version = "=7.0.0", optional = true }

[target.'cfg(windows)'.dependencies]
widestring = { version = "1", optional = true }
system-interface = { version = "=0.27.3", optional = true }
conpty-oxide = { version = "=0.1.2", optional = true }
windows-spawn = { version = "=0.1.0", optional = true }
win-custody = { version = "=0.1.2", optional = true }
winx = { version = "=0.36.4", optional = true }

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "thin"
